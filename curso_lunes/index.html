<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #0a1226;
    --night-deep: #050914;
    --star: #cfe0ff;
    --ember: #ff7a3d;
    --ember-dim: #a34a22;
    --scale: 1;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background: radial-gradient(ellipse at 50% 30%, var(--night) 0%, var(--night-deep) 70%);
    overflow: hidden;
    font-family: 'Space Mono', monospace;
  }

  #stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#stars{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  svg#draco{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-58%);
    width: min(90vw, 720px);
    height: auto;
    opacity: 0;
    animation: revealLines 2.4s ease-out 0.4s forwards;
  }

  svg#draco path{
    fill: none;
    stroke: var(--ember-dim);
    stroke-width: 1;
    stroke-linecap: round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 2.6s ease-out 0.4s forwards;
  }

  svg#draco circle{
    fill: var(--star);
    opacity: 0;
    animation: pop 0.6s ease-out forwards;
  }

  @keyframes revealLines{
    to{ opacity: 1; }
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  @keyframes pop{
    to{ opacity: 1; }
  }

  .content{
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--star);
    opacity: 0;
    transform: translateY(14px);
    animation: rise 1s cubic-bezier(.2,.8,.2,1) 2.6s forwards;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  .eyebrow{
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    color: var(--ember);
    margin: 0 0 0.6rem;
    font-weight: 700;
  }

  h1{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.1rem, 7vw, 4.6rem);
    margin: 0;
    line-height: 1.05;
    background: linear-gradient(180deg, #ffffff 0%, var(--star) 55%, var(--ember) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.01em;
  }

  p.tag{
    margin: 1rem 0 0;
    font-size: 0.85rem;
    color: #7f92c2;
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    svg#draco, svg#draco path, svg#draco circle, .content{
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
    }
  }

  .navbar {
    position: relative;
    z-index: 1000;

    display: flex;
    justify-content: center;
    gap: 35px;

    padding: 18px;

    background: rgba(10, 15, 30, 0.9);

    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.navbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.navbar a:hover {
    color: orange;
}
</style>
</head>
<body>

  <nav class="navbar">
    <a href="#">Gamaliel</a>
    <a href="#">Jesus</a>
    <a href="#">Jimmy</a>
    <a href="#">Andres</a>
    <a href="#">Silvestre</a>
</nav>

<div id="stage">
  <canvas id="stars"></canvas>

  <svg id="draco" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
    <path d="M 40 380 L 110 340 L 100 260 L 170 230 L 230 270 L 300 240 L 280 160 L 350 120 L 420 150 L 470 100 L 540 90" />
    <g id="draco-stars"></g>
  </svg>

  <div class="content">
    <p class="eyebrow">DEV &amp; ESTUDIANTE</p>
    <h1>Jesús Adán<br>Álvarez Ramírez</h1>
    <p class="tag">software · systems · code</p>
  </div>
</div>

<script>
  // Estrellas de fondo
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w, h, stars;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeStars(n){
    const arr = [];
    for(let i=0;i<n;i++){
      arr.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*1.3 + 0.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.4 + Math.random()*0.8
      });
    }
    return arr;
  }
  stars = makeStars(160);

  function tick(t){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const twinkle = 0.5 + 0.5*Math.sin(t/1000*s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(207,224,255,${0.15 + twinkle*0.6})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Puntos de la constelación (coinciden con los vértices del path)
  const points = [
    [40,380],[110,340],[100,260],[170,230],[230,270],
    [300,240],[280,160],[350,120],[420,150],[470,100],[540,90]
  ];
  const g = document.getElementById('draco-stars');
  points.forEach((p, i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', p[0]);
    c.setAttribute('cy', p[1]);
    c.setAttribute('r', i===0 || i===points.length-1 ? 5 : 3);
    c.style.animationDelay = (0.5 + i*0.2) + 's';
    g.appendChild(c);
  });
</script>

</body>
</html>
